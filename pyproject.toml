[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-policy-assistant"
version = "0.1.0"
description = "A provider-neutral, grounded RAG service for e-commerce policies"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rag_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

