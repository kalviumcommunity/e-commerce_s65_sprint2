name: Documentation quality

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/validate_docs.py"
      - ".github/workflows/docs-quality.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/validate_docs.py"
      - ".github/workflows/docs-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation
        run: python scripts/validate_docs.py
