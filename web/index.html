<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Policy Assistant</title>
<style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}textarea{width:100%;min-height:90px}button{padding:.6rem 1rem;margin-top:.5rem}.answer{white-space:pre-wrap;background:#f4f4f4;padding:1rem;margin-top:1rem}.citation{font-size:.9rem;color:#555}</style></head>
<body><h1>E-commerce Policy Assistant</h1><p>Ask about an approved product or return policy.</p>
<form id="ask"><textarea id="question" required placeholder="What is the return window for electronics?"></textarea><button>Ask</button></form><section id="result" class="answer" hidden></section>
<script>const form=document.querySelector('#ask'),q=document.querySelector('#question'),out=document.querySelector('#result');form.addEventListener('submit',async e=>{e.preventDefault();out.hidden=false;out.textContent='Checking approved evidence…';try{const r=await fetch('/query',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q.value})});const d=await r.json();out.textContent=d.answer+'\n\nStatus: '+d.status+'\n'+(d.citations||[]).map(c=>'Source: '+c.document+' — '+c.location).join('\n')}catch(err){out.textContent='The service is temporarily unavailable. Please try again.'}});</script></body></html>
